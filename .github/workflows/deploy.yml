name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write   # required to exchange the OIDC token for the AWS role
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: root
            bucket: meneghel-me
            distribution_secret: CF_DIST_ROOT
          - app: maykon
            bucket: maykon-meneghel-me
            distribution_secret: CF_DIST_MAYKON
          - app: manu
            bucket: manu-meneghel-me
            distribution_secret: CF_DIST_MANU
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build -w @meneghel/${{ matrix.app }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: sa-east-1

      # Hashed assets are immutable; HTML must never be cached at the edge for
      # long or a deploy takes hours to become visible.
      - name: Sync immutable assets
        run: |
          aws s3 sync apps/${{ matrix.app }}/dist s3://${{ matrix.bucket }} \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync HTML
        run: |
          aws s3 sync apps/${{ matrix.app }}/dist s3://${{ matrix.bucket }} \
            --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets[matrix.distribution_secret] }} \
            --paths "/*"
